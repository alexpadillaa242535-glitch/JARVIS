name: Build APK Cloud

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'
          
      - name: Install Flutter & Android SDK (14 to 16)
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter
          echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH
          
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          echo "Instalando SDKs de Android 14 (34), 15 (35) y 16 (36)..."
          sdkmanager --install "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          
          yes | sdkmanager --licenses || true
          flutter config --android-sdk $ANDROID_HOME
          flutter --version
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build Debug APK
        run: flutter build apk --debug --verbose
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
