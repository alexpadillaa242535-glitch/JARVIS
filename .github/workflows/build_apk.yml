name: Build APK Cloud

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'
          
      - name: Install Flutter & Configure Android SDK
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter
          echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH
          
          # Conectar con el SDK de Android nativo del runner de Ubuntu
          export ANDROID_HOME=/usr/local/lib/android/sdk
          ./_flutter/bin/flutter config --android-sdk $ANDROID_HOME
          yes | ./_flutter/bin/flutter doctor --android-licenses || true
          ./_flutter/bin/flutter --version
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build Debug APK
        run: flutter build apk --debug
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
