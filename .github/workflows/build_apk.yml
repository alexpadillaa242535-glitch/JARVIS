name: Build APK Cloud

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platforms (14 to 16)
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Flutter via Git
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter
          echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH
          ./_flutter/bin/flutter --version
          
      - name: Install Dependencies
        run: ./_flutter/bin/flutter pub get
        
      - name: Build Debug APK
        run: ./_flutter/bin/flutter build apk --debug --verbose
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
